name: control-repo-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required tools
        run: |
          git --version
          jq --version
          rg --version

      - name: Run orchestration shell tests
        run: bash scripts/orchestration/run-ci-tests.sh
