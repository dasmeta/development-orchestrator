image: ubuntu:24.04

definitions:
  steps:
    - step: &orchestration-tests
        name: Orchestration shell tests
        script:
          - apt-get update
          - apt-get install -y --no-install-recommends git jq ripgrep ca-certificates
          - bash scripts/orchestration/run-ci-tests.sh

pipelines:
  pull-requests:
    '**':
      - step: *orchestration-tests
  branches:
    main:
      - step: *orchestration-tests
